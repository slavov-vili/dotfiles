# App launcher
bindsym $mod+r exec --no-startup-id $launcher

# Launch Terminal
bindsym $mod+Return exec $launch_term

bindsym $mod+Control+Shift+Return exec --no-startup-id "$HOME/Scripts/start.sh"

bindsym $mod+Shift+e exec --no-startup-id "$HOME/.config/rofi/scripts/emoji_picker.sh"

bindsym $mod+Shift+w exec --no-startup-id "$HOME/.config/rofi/scripts/window_switcher.sh"

# Kill focused window
bindsym $mod+Shift+q kill

# Currently replaced with pa-applet
# Use pactl to adjust volume in PulseAudio.
# bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +2% && $refresh_status_bar
# bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -2% && $refresh_status_bar
# bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_status_bar
# bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_status_bar

# Change focus
bindsym $mod+$left     focus left
bindsym $mod+$down     focus down
bindsym $mod+$up       focus up
bindsym $mod+$right    focus right
# Same, but for arrow keys:
bindsym $mod+Left      focus left
bindsym $mod+Down      focus down
bindsym $mod+Up        focus up
bindsym $mod+Right     focus right
bindsym $alt+Tab       focus next
bindsym $alt+Shift+Tab focus prev

# Focus the parent container
bindsym $mod+Shift+u focus parent
# focus the child container
bindsym $mod+Shift+d focus child

# Move focused window
bindsym $mod+Shift+$left  move left
bindsym $mod+Shift+$down  move down
bindsym $mod+Shift+$up    move up
bindsym $mod+Shift+$right move right
# Same, but for arrow keys:
bindsym $mod+Shift+Left   move left
bindsym $mod+Shift+Down   move down
bindsym $mod+Shift+Up     move up
bindsym $mod+Shift+Right  move right

# Split horizontally
bindsym $mod+Shift+s split h
# Split vertically
bindsym $mod+Shift+v split v

# Change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+t layout tabbed
bindsym $mod+w layout toggle split

# Toggle tiling / floating
bindsym $mod+space   floating toggle
# Change focus between tiling / floating windows
bindsym $mod+Tab     focus mode_toggle
# Enter fullscreen mode for the focused container
bindsym $mod+Shift+f fullscreen toggle

# Move the currently focused window to the scratchpad
bindsym $mod+minus move scratchpad
# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym $mod+plus scratchpad show

# Switch to workspace
bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10
bindsym $mod+n workspace next
bindsym $mod+p workspace prev

# Move focused container to workspace (and go there)
bindsym $mod+Shift+1 move container to workspace $ws1,  workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2;  workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3;  workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4;  workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5;  workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6;  workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7;  workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8;  workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9;  workspace $ws9
bindsym $mod+Shift+0 move container to workspace $ws10; workspace $ws10
bindsym $mod+Shift+n move container to workspace next;  workspace next
bindsym $mod+Shift+p move container to workspace prev;  workspace prev

# Move workspace to output/monitor
bindsym $mod+Control+Shift+$left  move workspace to output left
bindsym $mod+Control+Shift+$down  move workspace to output down
bindsym $mod+Control+Shift+$up    move workspace to output up
bindsym $mod+Control+Shift+$right move workspace to output right
bindsym $mod+Control+Shift+n      move workspace to output next
bindsym $mod+Control+Shift+m      move workspace to output primary
bindsym $mod+Control+Shift+o      move workspace to output nonprimary
# Same, but for arrow keys
bindsym $mod+Control+Shift+Left   move workspace to output left
bindsym $mod+Control+Shift+Down   move workspace to output down
bindsym $mod+Control+Shift+Up     move workspace to output up
bindsym $mod+Control+Shift+Right  move workspace to output right

# reload the configuration file
bindsym $mod+Control+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym $mod+Control+Shift+r exec --no-startup-id "xrandr --auto && i3-msg restart && sleep 1 && $HOME/.config/polybar/launch.sh"
# exit i3 (logs you out of your X session)
bindsym $mod+Control+Shift+Escape exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"



set $mode_launcher      launcher
set $mode_launcher_desc "Launcher mode: [R]un | [T]erminal | [B]rowser | [F]ile explorer"
bindsym $mod+q mode     "$mode_launcher"; exec $mode_notify_warn -m $mode_launcher_desc
mode "$mode_launcher" {
        bindsym r exec --no-startup-id $launcher
        bindsym Shift+r exec --no-startup-id $launcher; mode $mode_default; exec $mode_unnotify_warn

        bindsym t exec --no-startup-id $launch_term
        bindsym Shift+t exec --no-startup-id $launch_term; mode $mode_default; exec $mode_unnotify_warn

        bindsym f exec $launch_fileexp
        bindsym Shift+f exec $launch_fileexp; mode $mode_default; exec $mode_unnotify_warn

        bindsym b exec $launch_browser
        bindsym Shift+b exec $launch_browser; mode $mode_default; exec $mode_unnotify_warn

        bindsym Shift+q kill
# Return back to normal
        bindsym Escape mode $mode_default; exec $mode_unnotify_warn
}



# Resize window (you can also use the mouse for that)
set $mode_resize            resize
set $mode_resize_desc       "Resize mode: H = Shrink width | J = Grow height | K = Shrink height | L = Grow width"
bindsym $mod+Control+r mode "$mode_resize"; exec $mode_notify_error -m $mode_resize_desc
bindsym $mod+equal resize set width 50ppt height 50ppt
mode "$mode_resize" {
        bindsym $left  resize shrink width 10 px or 10 ppt
        bindsym $down  resize grow height 10 px or 10 ppt
        bindsym $up    resize shrink height 10 px or 10 ppt
        bindsym $right resize grow width 10 px or 10 ppt

# Same, but for arrow keys
        bindsym Left   resize shrink width 10 px or 10 ppt
        bindsym Down   resize grow height 10 px or 10 ppt
        bindsym Up     resize shrink height 10 px or 10 ppt
        bindsym Right  resize grow width 10 px or 10 ppt

        bindsym equal resize set width 50ppt height 50ppt

# Return back to normal
        bindsym Escape mode $mode_default; exec $mode_unnotify_error
}



set $mode_layout_switcher      layout_switcher
set $mode_layout_switcher_desc "Layout switcher mode: [W]indow tile | [S]tacking | [T]abbed | [F]ull screen | [space] Floating | [Tab] Toggle float focus"
bindsym $mod+Control+y mode    "$mode_layout_switcher"; exec $mode_notify_warn -m $mode_layout_switcher_desc
mode "$mode_layout_switcher" {
        bindsym w layout toggle split
        bindsym s layout stacking
        bindsym t layout tabbed

        bindsym space   floating toggle
        bindsym Tab     focus mode_toggle
        bindsym Shift+f fullscreen toggle

# Return back to normal
        bindsym Escape mode $mode_default; exec $mode_unnotify_warn
}



set $mode_window_mover      window_mover
set $mode_window_mover_desc "Window mover mode: [N]ext | [P]revious | [0-9] workspace"
bindsym $mod+Control+m mode "$mode_window_mover"; exec $mode_notify_warn -m $mode_window_mover_desc
mode "$mode_window_mover" {
        bindsym 1 move container to workspace $ws1,  workspace $ws1
        bindsym 2 move container to workspace $ws2,  workspace $ws2
        bindsym 3 move container to workspace $ws3,  workspace $ws3
        bindsym 4 move container to workspace $ws4,  workspace $ws4
        bindsym 5 move container to workspace $ws5,  workspace $ws5
        bindsym 6 move container to workspace $ws6,  workspace $ws6
        bindsym 7 move container to workspace $ws7,  workspace $ws7
        bindsym 8 move container to workspace $ws8,  workspace $ws8
        bindsym 9 move container to workspace $ws9,  workspace $ws9
        bindsym 0 move container to workspace $ws10, workspace $ws10

        # FIXME: calling it again breaks stuff, the window does not move!
        bindsym n move container to workspace next,         workspace next
        bindsym p move container to workspace prev,         workspace prev

# Return back to normal
        bindsym Escape mode $mode_default; exec $mode_unnotify_warn
}



set $mode_monitor_manager       monitor_manager
set $mode_monitor_manager_desc  "Monitor manager mode: [hjkl] = Navigation | [Shift+hjkl] = Move workspace to monitor | [N]ext [M]=primary [O]=nonprimary"
bindsym $mod+Control+minus mode "$mode_monitor_manager"; exec $mode_notify_warn -m $mode_monitor_manager_desc
mode "$mode_monitor_manager" {
        # Navigation
        bindsym $left  focus output left
        bindsym $down  focus output down
        bindsym $up    focus output up
        bindsym $right focus output right
        bindsym n      focus output next
        bindsym m      focus output primary
        bindsym o      focus output nonprimary

        # Same, but for arrow keys
        bindsym Left   focus output left
        bindsym Down   focus output down
        bindsym Up     focus output up
        bindsym Right  focus output right

        # Move workspace
        bindsym Shift+$left  move workspace to output left
        bindsym Shift+$down  move workspace to output down
        bindsym Shift+$up    move workspace to output up
        bindsym Shift+$right move workspace to output right
        bindsym Shift+n      move workspace to output next
        bindsym Shift+m      move workspace to output primary
        bindsym Shift+o      move workspace to output nonprimary

        # Same, but for arrow keys
        bindsym Shift+Left   move workspace to output left
        bindsym Shift+Down   move workspace to output down
        bindsym Shift+Up     move workspace to output up
        bindsym Shift+Right  move workspace to output right

# Return back to normal
        bindsym Escape mode $mode_default; exec $mode_unnotify_warn
}
